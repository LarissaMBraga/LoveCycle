<div class="app-container">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">♡</span>
      <span>LoveCycle</span>
    </div>

    <nav class="navigation">
      <a class="nav-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span>⌂</span>
        <span class="nav-label">Dashboard</span>
      </a>

      <a class="nav-item" routerLink="/calendar" routerLinkActive="active">
        <span>▦</span>
        <span class="nav-label">Calendário</span>
      </a>

      <a class="nav-item" routerLink="/cycle" routerLinkActive="active">
        <span>◉</span>
        <span class="nav-label">Meu ciclo</span>
      </a>

      <a class="nav-item" routerLink="/notes" routerLinkActive="active">
        <span>✎</span>
        <span class="nav-label">Anotações</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      Feito com carinho ♡
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <p class="eyebrow">SEU ESPAÇO, SEU TEMPO</p>
        <h1>Olá! Como você está hoje?</h1>
      </div>

      <div class="profile">
        <span>LC</span>
      </div>
    </header>

    <router-outlet></router-outlet>
  </main>

  <nav class="mobile-navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <span>⌂</span>
      <small>Início</small>
    </a>

    <a routerLink="/calendar" routerLinkActive="active">
      <span>▦</span>
      <small>Calendário</small>
    </a>

    <a routerLink="/cycle" routerLinkActive="active">
      <span>◉</span>
      <small>Ciclo</small>
    </a>

    <a routerLink="/notes" routerLinkActive="active">
      <span>✎</span>
      <small>Anotações</small>
    </a>
  </nav>
</div>
