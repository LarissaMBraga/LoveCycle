<div class="form-container">
  <div class="form-header">
    <div>
      <p class="eyebrow">SEU DIÁRIO</p>
      <h2>Como você está? 🌷</h2>
      <p>{{ date }}</p>
    </div>

    <button type="button" class="close-button" (click)="cancelled.emit()">×</button>
  </div>

  <form (ngSubmit)="submit()">
    <section class="form-section">
      <label>🩸 Fluxo menstrual</label>

      <div class="option-grid">
        @for (option of flowOptions; track option.value) {
          <button
            type="button"
            class="option-button flow-option"
            [class.active]="flow === option.value"
            (click)="flow = $any(option.value)"
          >
            <span class="flow-emoji">{{ option.emoji }}</span>
            {{ option.label }}
          </button>
        }
      </div>
    </section>

    <section class="form-section">
      <label>💕 Houve relações sexuais neste dia?</label>

      <div class="option-grid">
        <button
          type="button"
          class="option-button"
          [class.active]="sexualActivity === 'no'"
          (click)="sexualActivity = 'no'; protectionMethod = ''"
        >
          Não
        </button>

        <button
          type="button"
          class="option-button"
          [class.active]="sexualActivity === 'yes'"
          (click)="sexualActivity = 'yes'"
        >
          Sim
        </button>
      </div>

      @if (sexualActivity === 'yes') {
        <div class="conditional-section">
          <label>Qual foi o método de proteção?</label>

          <div class="option-grid">
            <button
              type="button"
              class="option-button"
              [class.active]="protectionMethod === 'condom'"
              (click)="protectionMethod = 'condom'"
            >
              🛡️ Com preservativo
            </button>

            <button
              type="button"
              class="option-button"
              [class.active]="protectionMethod === 'no-condom'"
              (click)="protectionMethod = 'no-condom'"
            >
              Sem preservativo
            </button>

            <button
              type="button"
              class="option-button"
              [class.active]="protectionMethod === 'other'"
              (click)="protectionMethod = 'other'"
            >
              💊 Outro método
            </button>

            <button
              type="button"
              class="option-button"
              [class.active]="protectionMethod === 'prefer-not-to-say'"
              (click)="protectionMethod = 'prefer-not-to-say'"
            >
              Prefiro não informar
            </button>
          </div>
        </div>
      }
    </section>

    <section class="form-section">
      <label>💊 Anticoncepcional</label>

      <p class="section-description">Qual foi a situação neste dia?</p>

      <div class="option-grid">
        <button
          type="button"
          class="option-button"
          [class.active]="contraceptiveStatus === 'taken'"
          (click)="contraceptiveStatus = 'taken'"
        >
          ✓ Tomei
        </button>

        <button
          type="button"
          class="option-button"
          [class.active]="contraceptiveStatus === 'missed'"
          (click)="contraceptiveStatus = 'missed'"
        >
          ✕ Não tomei
        </button>

        <button
          type="button"
          class="option-button"
          [class.active]="contraceptiveStatus === 'not-used'"
          (click)="contraceptiveStatus = 'not-used'"
        >
          Não utilizo
        </button>
      </div>
    </section>

    <section class="form-section">
      <label>🌸 Sintomas</label>

      <div class="symptom-grid">
        @for (symptom of symptomOptions; track symptom) {
          <button
            type="button"
            class="symptom-button"
            [class.active]="symptoms.includes(symptom)"
            (click)="toggleSymptom(symptom)"
          >
            {{ symptom }}
          </button>
        }
      </div>
    </section>

    <section class="form-section">
      <label>Como está seu humor?</label>

      <div class="mood-grid">
        @for (option of moodOptions; track option.value) {
          <button
            type="button"
            class="mood-button"
            [class.active]="mood === option.value"
            (click)="mood = option.value"
          >
            <span>{{ option.emoji }}</span>
            <small>{{ option.value }}</small>
          </button>
        }
      </div>
    </section>

    <section class="form-section">
      <label>Intensidade da dor: {{ pain }}/10</label>

      <input
        type="range"
        name="pain"
        min="0"
        max="10"
        [(ngModel)]="pain"
      />
    </section>

    <section class="form-section">
      <label>📝 Observações</label>

      <textarea
        name="notes"
        [(ngModel)]="notes"
        placeholder="Como foi seu dia? Quer registrar alguma coisa?"
        rows="4"
      ></textarea>
    </section>

    <div class="form-actions">
      <button type="button" class="cancel-button" (click)="cancelled.emit()">
        Cancelar
      </button>

      <button type="submit" class="save-button">
        Salvar registro
      </button>
    </div>
  </form>
</div>
